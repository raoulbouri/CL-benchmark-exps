track: D
suite: libero_10
n_tasks: 10
method: dmpel
budget: full
tag: rho005-bias-ne10-FIXEDWD
protocol: original
seed: 100
phase: e4
codebase: dmpel
machine: xulab-rtx5090
dmpel:
  policy: bc_foundation_dmpel_policy
  lifelong: dmpel
  env: {CLB_AUDIT: 1, CLB_FIX_FROZEN_WD: 1}
